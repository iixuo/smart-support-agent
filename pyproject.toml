[project]
name = "smart-support-agent"
version = "0.1.0"
description = "E-commerce customer-support agent: Function Calling + hybrid RAG + business tools, with eval vs plain RAG"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
